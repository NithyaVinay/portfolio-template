<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Status Header -->
  <header class="status-bar">
      <span class="status-indicator"></span>
      <span id="name-header">SYS.ONLINE</span>
      <nav id="links"></nav>
  </header>

  <main>
    <!-- Cinematic Hero Section -->
    <section class="hero-cinematic">
      <p class="meta-tag">01 // IDENTITY</p>
      <h1 id="name"></h1>
      <p id="tagline" class="hero-desc"></p>
    </section>

    <!-- About Section -->
    <section>
      <h2>About</h2>
      <p id="bio" class="glass-card" style="padding: 24px; margin-top: 16px;"></p>
    </section>

    <!-- Skills Matrix Grid -->
    <section>
      <h2>Core Stack Matrix</h2>
      <ul id="skills" class="matrix-grid" style="list-style: none; padding: 0; margin-top: 16px;"></ul>
    </section>

    <!-- Projects Grid -->
    <section>
      <h2>Featured Deployments</h2>
      <div id="projects" class="project-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 16px;"></div>
    </section>
  </main>

  <footer id="footer" style="margin-top: 60px; color: var(--muted); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;"></footer>

  <script src="script.js"></script>
</body>
</html>
