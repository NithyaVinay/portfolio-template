<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sleek Top Bar -->
  <header class="top-nav">
    <nav id="links" class="nav-links"></nav>
  </header>

  <main class="portfolio-container">
    <!-- Hero Section -->
    <section class="hero-section">
      <h1 id="name"></h1>
      <p id="tagline" class="tagline-text"></p>
    </section>

    <!-- About Section -->
    <section class="content-section">
      <h2>About</h2>
      <p id="bio" class="bio-card"></p>
    </section>

    <!-- Skills Section -->
    <section class="content-section">
      <h2>Toolkit</h2>
      <ul id="skills" class="skills-grid"></ul>
    </section>

    <!-- Projects Section -->
    <section class="content-section">
      <h2>Projects</h2>
      <div id="projects" class="projects-grid"></div>
    </section>
  </main>

  <footer id="footer" class="footer-bar"></footer>

  <script src="script.js"></script>
</body>
</html>
